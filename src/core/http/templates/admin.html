<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Bot - Панель управления</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Elemental Bot</h1>
            <span id="tg-user" class="text-xs px-2.5 py-1 bg-gray-700 rounded-full text-gray-300">TMA Ready</span>
        </div>

        <!-- Auth Screening / Loader -->
        <div id="auth-screen" class="text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-sm text-gray-300">Проверка авторизации Telegram Mini App...</p>
        </div>

        <!-- Main Panel Content (Hidden until verified) -->
        <div id="panel-content" class="space-y-4 hidden">
            <!-- Bot IP Display -->
            <div class="bg-gray-700/50 p-4 rounded-xl border border-gray-600/50">
                <p class="text-sm text-gray-400">IP адрес бота</p>
                <p id="bot-ip" class="text-lg font-semibold text-sky-400 mt-1 font-mono">-</p>
            </div>

            <!-- Context Size Input -->
            <div class="space-y-2">
                <label for="context-size-input" class="block text-sm font-medium text-gray-300">Размер контекста (Max Tokens)</label>
                <input type="number" id="context-size-input" min="100" max="1000000" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- System Prompt Input -->
            <div class="space-y-2">
                <label for="system-prompt-input" class="block text-sm font-medium text-gray-300">Системный промпт</label>
                <textarea id="system-prompt-input" rows="5" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono"></textarea>
            </div>

            <!-- Model Selection Form -->
            <div class="space-y-2">
                <label for="model-select" class="block text-sm font-medium text-gray-300">Выберите или введите модель</label>
                <select id="model-select" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="gemini-3.1-flash-lite-preview">gemini-3.1-flash-lite-preview (Gemini)</option>
                    <option value="gemini-2.5-flash">gemini-2.5-flash (Gemini)</option>
                    <option value="openai/gpt-4o-mini">openai/gpt-4o-mini (OpenRouter)</option>
                    <option value="anthropic/claude-3.5-haiku">anthropic/claude-3.5-haiku (OpenRouter)</option>
                </select>
            </div>

            <!-- Action Button -->
            <button id="save-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center">
                Сохранить настройки
            </button>

            <!-- Status Message -->
            <div id="status-msg" class="hidden text-center text-sm p-3 rounded-xl"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Отображение имени пользователя из Telegram если доступно
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('tg-user').innerText = `@${user.username || user.first_name || 'admin'}`;
        }

        const authScreen = document.getElementById('auth-screen');
        const panelContent = document.getElementById('panel-content');
        const saveBtn = document.getElementById('save-btn');
        const modelSelect = document.getElementById('model-select');
        const systemPromptInput = document.getElementById('system-prompt-input');
        const contextSizeInput = document.getElementById('context-size-input');
        const statusMsg = document.getElementById('status-msg');
        const botIpEl = document.getElementById('bot-ip');

        // Загрузка настроек и верификация initData
        async function loadSettings() {
            try {
                const response = await fetch('/api/settings?initData=' + encodeURIComponent(tg.initData || ''));
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Доступ запрещен');
                }

                botIpEl.innerText = data.bot_ip || '127.0.0.1';
                contextSizeInput.value = data.context_size || 10000;
                systemPromptInput.value = data.system_prompt || '';

                const currentModel = data.current_model;
                if (currentModel) {
                    let found = false;
                    for (let option of modelSelect.options) {
                        if (option.value === currentModel) {
                            modelSelect.value = currentModel;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        const opt = document.createElement('option');
                        opt.value = currentModel;
                        opt.text = currentModel + ' (Current)';
                        modelSelect.add(opt);
                        modelSelect.value = currentModel;
                    }
                }

                authScreen.classList.add('hidden');
                panelContent.classList.remove('hidden');
            } catch (err) {
                authScreen.innerHTML = `
                    <div class="text-center py-4">
                        <div class="text-red-400 text-4xl mb-2">🚫</div>
                        <h2 class="text-lg font-bold text-red-300 mb-1">Доступ запрещен</h2>
                        <p class="text-xs text-gray-400 leading-relaxed">${err.message || 'Откройте эту страницу через официальный Telegram Mini App бота.'}</p>
                    </div>
                `;
            }
        }

        loadSettings();

        saveBtn.addEventListener('click', async () => {
            const selectedModel = modelSelect.value;
            const systemPrompt = systemPromptInput.value;
            const contextSize = parseInt(contextSizeInput.value, 10);

            saveBtn.disabled = true;
            saveBtn.innerText = 'Сохранение...';
            statusMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/set-model', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        system_prompt: systemPrompt,
                        context_size: contextSize,
                        initData: tg.initData || ''
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.innerText = 'Настройки успешно применены!';
                    statusMsg.className = 'text-center text-sm p-3 rounded-xl bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 block';
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } else {
                    throw new Error(data.error || 'Ошибка сохранения');
                }
            } catch (err) {
                statusMsg.innerText = err.message || 'Произошла ошибка соединения';
                statusMsg.className = 'text-center text-sm p-3 rounded-xl bg-red-900/50 text-red-300 border border-red-700/50 block';
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Сохранить настройки';
            }
        });
    </script>
</body>
</html>
